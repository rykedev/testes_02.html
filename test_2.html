<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efeito de Corações com o mouse</title>
    <style>
        body {
            background-color: #121212;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #ui {
            position: relative;
        }

        .love_word {
            color: #ea80b0;
            font-size: 1.4rem;
            transform: translateY(-100%) rotateZ(-30deg);
            text-shadow: 0 0 10px #fff;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        /* Estilo para os corações gerados pelo rato */
        .floating-heart {
            position: absolute;
            color: #ea80b0;
            font-size: 1.2rem;
            user-select: none;
            pointer-events: none;
            text-shadow: 0 0 8px #fff;
            animation: floatUp 1s ease-out forwards;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-60px) scale(1.4) rotate(20deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div id="ui">
        <span class="love_word">❤️eu te amo</span>
    </div>

    <!-- Script para criar os corações ao mover o rato -->
    <script>
        document.addEventListener('mousemove', function(e) {
            // Cria um elemento de coração
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerHTML = '❤️';
            
            // Posiciona o coração onde o cursor está
            heart.style.left = e.pageX + 'px';
            heart.style.top = e.pageY + 'px';
            
            document.body.appendChild(heart);
            
            // Remove o elemento após a animação terminar (1 segundo)
            setTimeout(() => {
                heart.remove();
            }, 1000);
        });
    </script>

</body>
</html>
